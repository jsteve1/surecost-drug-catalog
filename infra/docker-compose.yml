services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: surecost
      POSTGRES_USER: surecost
      POSTGRES_PASSWORD: surecost
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U surecost -d surecost"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      SECRET_KEY: docker-dev-secret-key-change-in-production
      DEBUG: "True"
      DATABASE_URL: postgres://surecost:surecost@db:5432/surecost
      LOG_LEVEL: INFO
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      LOAD_SEED: "true"
      SEED_FILE_PATH: /app/seed_drugs.json
    volumes:
      - ../seed_drugs.json:/app/seed_drugs.json:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
